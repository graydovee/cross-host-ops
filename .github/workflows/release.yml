name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-release-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin xho --bin xhod

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="cross-host-ops-${TAG}-${{ matrix.target }}"
          mkdir -p "${PKG}"
          cp "target/${{ matrix.target }}/release/xho" "${PKG}/"
          cp "target/${{ matrix.target }}/release/xhod" "${PKG}/"
          cp config.example.toml "${PKG}/"
          cp packaging/systemd/xhod.service "${PKG}/"
          tar -czf "${PKG}.tar.gz" "${PKG}"

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = ${env:GITHUB_REF_NAME}
          $PKG = "cross-host-ops-$TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $PKG | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/xho.exe" "$PKG/"
          Copy-Item "target/${{ matrix.target }}/release/xhod.exe" "$PKG/"
          Copy-Item config.example.toml "$PKG/"
          # No systemd unit on Windows.
          Compress-Archive -Path "$PKG/*" -DestinationPath "$PKG.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: |
            cross-host-ops-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            cross-host-ops-${{ github.ref_name }}-${{ matrix.target }}.zip

  docker-ghcr:
    name: docker ghcr (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/cross-host-ops,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: docker ghcr (merge manifest)
    runs-on: ubuntu-latest
    needs: docker-ghcr
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cross-host-ops
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Create manifest list and push
        shell: bash
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/cross-host-ops@sha256:%s ' *)

      - name: Inspect image
        shell: bash
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/cross-host-ops:${{ github.ref_name }}"

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs:
      - build-release-binaries
      - docker-merge
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Commits"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              git log ${PREV_TAG}..HEAD --no-merges --pretty=format:"- %s (%h)"
            else
              git log HEAD --no-merges --pretty=format:"- %s (%h)"
            fi
            echo ""
          } > RELEASE_NOTES.md
          echo "Generated RELEASE_NOTES.md:"
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
